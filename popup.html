<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>middledot</title>
  <style>
    :root {
      --bg: #f2f2f4;
      --key: #ffffff;
      --key-edge: #dcdce1;
      --key-hover: #e9e9ee;
      --text: #1d1d1f;
      --muted: #86868e;
      --accent: #a2e4b8;
      --on-accent: #0e3b20;
      --error: #f5c6c6;
      --on-error: #5a1515;
      --focus: #4c8dff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1b1e;
        --key: #2b2b2f;
        --key-edge: #3b3b41;
        --key-hover: #36363b;
        --text: #f1f1f3;
        --muted: #8b8b94;
      }
    }
    body {
      width: max-content;
      margin: 0;
      padding: 6px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    button,
    input {
      font: inherit;
      color: inherit;
    }
    #grid {
      border-collapse: separate;
      border-spacing: 6px;
    }
    #grid td {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 20px;
      line-height: 1;
      text-align: center;
      vertical-align: middle;
    }
    #grid .char {
      cursor: pointer;
      background: var(--key);
      border-color: var(--key-edge);
      box-shadow: 0 1px 0 var(--key-edge);
      transition: background-color .12s, border-color .12s, color .12s;
    }
    #grid .char:hover {
      background: var(--key-hover);
    }
    #grid .char:active,
    #grid .char.copied {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: none;
      color: var(--on-accent);
    }
    #grid td:focus-visible,
    #grid td.drop-target,
    #grid td:has(> .cell-input) {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }
    #grid .dragging {
      opacity: .4;
    }
    /* Режим правки */
    .editing #grid td:not(.char) {
      border-style: dashed;
      border-color: var(--key-edge);
      color: var(--muted);
      cursor: pointer;
    }
    .editing #grid td:not(.char):hover {
      background: var(--key-hover);
    }
    .editing #grid td:empty::after {
      content: '+';
      font-size: 16px;
    }
    .editing #grid .char {
      cursor: grab;
    }
    .editing #grid .char:active {
      background: var(--key-hover);
      border-color: var(--key-edge);
      color: var(--text);
    }
    .cell-input {
      box-sizing: border-box;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 20px;
      text-align: center;
      user-select: text;
    }
    #footer,
    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 0;
      min-width: calc(100% - 12px);
      margin: 0 6px 6px;
    }
    #toolbar {
      display: none;
      justify-content: space-between;
    }
    .editing #toolbar {
      display: flex;
    }
    #message {
      flex: 1;
      min-width: 0;
      height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 24px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background-color .15s, color .15s;
    }
    #message.ok {
      background: var(--accent);
      color: var(--on-accent);
    }
    #message.error {
      background: var(--error);
      color: var(--on-error);
    }
    button {
      height: 24px;
      padding: 0 10px;
      border: 1px solid var(--key-edge);
      border-radius: 6px;
      background: var(--key);
      font-size: 12px;
      cursor: pointer;
    }
    button:hover {
      background: var(--key-hover);
    }
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }
    #edit {
      display: grid;
      place-items: center;
      flex: none;
      width: 24px;
      padding: 0;
      color: var(--muted);
    }
    .editing #edit {
      display: none;
    }
    #done {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
    }
    #done:hover {
      filter: brightness(.96);
    }
    #reset.confirm {
      background: var(--error);
      border-color: var(--error);
      color: var(--on-error);
    }
  </style>
</head>
<body>
  <table id="grid">
    <tr>
      <td class="char" data-name="Left guillemet">«</td>
      <td class="char" data-name="Right guillemet">»</td>
      <td></td>
      <td></td>
      <td></td>
    </tr>
    <tr>
      <td class="char" data-name="Right arrow">→</td>
      <td class="char" data-name="Left arrow">←</td>
      <td class="char" data-name="Up arrow">↑</td>
      <td class="char" data-name="Down arrow">↓</td>
      <td></td>
    </tr>
    <tr>
      <td class="char" data-name="Tilde">~</td>
      <td class="char" data-name="Almost equal">≈</td>
      <td class="char" data-name="Not equal">≠</td>
      <td class="char" data-name="Greater or equal">≥</td>
      <td class="char" data-name="Less or equal">≤</td>
    </tr>
    <tr>
      <td class="char" data-name="Dollar">$</td>
      <td class="char" data-name="Euro">€</td>
      <td></td>
      <td></td>
      <td></td>
    </tr>
    <tr>
      <td class="char" data-name="Multiplication">×</td>
      <td class="char" data-name="Minus">−</td>
      <td class="char" data-name="Plus-minus">±</td>
      <td></td>
      <td></td>
    </tr>
    <tr>
      <td class="char" data-name="En dash">–</td>
      <td class="char" data-name="Em dash">—</td>
      <td class="char" data-name="Bullet">•</td>
      <td class="char" data-name="Middle dot">·</td>
      <td></td>
    </tr>
    <tr>
      <td class="char" data-name="Katakana tsu">ツ</td>
      <td class="char" data-name="Copyright">©</td>
      <td></td>
      <td></td>
      <td></td>
    </tr>
  </table>
  <div id="footer">
    <div id="message"></div>
    <button id="edit" type="button" title="Edit layout" aria-label="Edit layout">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 20l1.2-4.8L16 4.4l3.6 3.6L8.8 18.8z"/>
        <path d="M13.6 6.8l3.6 3.6"/>
      </svg>
    </button>
  </div>
  <div id="toolbar">
    <button id="reset" type="button">Reset to default</button>
    <button id="done" type="button">Done</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
