<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #f2f2f4; color: #1d1d1f; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: #0e3b20; }
    a:hover { color: #1d1d1f; }
  </style>
</helmet>
<div style="width: 560px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px; background: #f2f2f4;">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #86868e;">Направление A</div>
    <div style="font-size: 22px; font-weight: 600;">Нажатая клавиша</div>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #5a5a61; text-wrap: pretty;">Клавиша из самого попапа в момент копирования — с точкой, в честь которой назван middledot. Скорее всего, лучше всех читается в 16 px, но точка сама по себе не говорит «символы», пока не знаешь продукт.</p>
  </div>
  <div style="display: flex; gap: 16px;">
    <div style="width: 160px; height: 160px; box-sizing: border-box; border-radius: 12px; background: #ffffff; border: 1px solid #dcdce1; display: flex; align-items: center; justify-content: center;">
      <svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="20" width="96" height="92" rx="22" fill="#78c393"></rect><rect x="16" y="18" width="96" height="92" rx="22" fill="#a2e4b8"></rect><circle cx="64" cy="64" r="14" fill="#0e3b20"></circle></svg>
    </div>
    <div style="width: 160px; height: 160px; box-sizing: border-box; border-radius: 12px; background: #1b1b1e; border: 1px solid #3b3b41; display: flex; align-items: center; justify-content: center;">
      <svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="20" width="96" height="92" rx="22" fill="#78c393"></rect><rect x="16" y="18" width="96" height="92" rx="22" fill="#a2e4b8"></rect><circle cx="64" cy="64" r="14" fill="#0e3b20"></circle></svg>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-size: 12px; color: #86868e;">16 · 32 · 48 px</div>
    <div style="display: flex; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 20px; padding: 12px 20px; border-radius: 10px; background: #ffffff; border: 1px solid #dcdce1;">
        <svg width="16" height="16" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="20" width="96" height="92" rx="22" fill="#78c393"></rect><rect x="16" y="18" width="96" height="92" rx="22" fill="#a2e4b8"></rect><circle cx="64" cy="64" r="14" fill="#0e3b20"></circle></svg>
        <svg width="32" height="32" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="20" width="96" height="92" rx="22" fill="#78c393"></rect><rect x="16" y="18" width="96" height="92" rx="22" fill="#a2e4b8"></rect><circle cx="64" cy="64" r="14" fill="#0e3b20"></circle></svg>
        <svg width="48" height="48" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="20" width="96" height="92" rx="22" fill="#78c393"></rect><rect x="16" y="18" width="96" height="92" rx="22" fill="#a2e4b8"></rect><circle cx="64" cy="64" r="14" fill="#0e3b20"></circle></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 20px; padding: 12px 20px; border-radius: 10px; background: #1b1b1e; border: 1px solid #3b3b41;">
        <svg width="16" height="16" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="20" width="96" height="92" rx="22" fill="#78c393"></rect><rect x="16" y="18" width="96" height="92" rx="22" fill="#a2e4b8"></rect><circle cx="64" cy="64" r="14" fill="#0e3b20"></circle></svg>
        <svg width="32" height="32" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="20" width="96" height="92" rx="22" fill="#78c393"></rect><rect x="16" y="18" width="96" height="92" rx="22" fill="#a2e4b8"></rect><circle cx="64" cy="64" r="14" fill="#0e3b20"></circle></svg>
        <svg width="48" height="48" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="20" width="96" height="92" rx="22" fill="#78c393"></rect><rect x="16" y="18" width="96" height="92" rx="22" fill="#a2e4b8"></rect><circle cx="64" cy="64" r="14" fill="#0e3b20"></circle></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
